[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gipimpin", email = "gipimpin@student.42roma.it" }
]
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "numpy>=2.2.6",
    "pydantic>=2.14.2",
    "tqdm>=4.70.1",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.0.0", 
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
